<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato — Currículo Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="sobre.html">Cryswerton Silva</a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="siteNav">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="site-nav" id="siteNav" aria-label="Principal">
      <ul class="nav-list">
        <li><a href="sobre.html">Sobre mim</a></li>
        <li><a href="formacao.html">Formação</a></li>
        <li><a href="portfolio.html">Portfólio</a></li>
        <li><a href="contato.html" class="is-active">Contato</a></li>
      </ul>
      <button type="button" class="theme-toggle" id="themeToggle" title="Alternar tema claro ou escuro">Tema</button>
    </nav>
  </header>

  <div class="nav-overlay" id="navOverlay" aria-hidden="true"></div>

  <main class="page-main">
    <h1 class="page-title">Contato</h1>
    <p class="lead">Envie uma mensagem (simulação local — nenhum dado é enviado a um servidor nesta demonstração).</p>

    <section class="section-block" aria-labelledby="sec-formulario">
      <h2 id="sec-formulario" class="visually-hidden">Formulário de mensagem</h2>
      <!-- Validação e envio simulado em js/contato.js -->
      <form class="contact-form" id="contactForm" novalidate>
        <p class="form-global-error" id="formGlobalError" role="alert"></p>

        <div class="form-group" data-field="nome">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>
          <span class="field-error" id="error-nome"></span>
        </div>

        <div class="form-group" data-field="email">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required>
          <span class="field-error" id="error-email"></span>
        </div>

        <div class="form-group" data-field="mensagem">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" required></textarea>
          <span class="field-error" id="error-mensagem"></span>
        </div>

        <button type="submit" class="form-submit">Enviar mensagem</button>
      </form>
    </section>
  </main>

  <!-- Modal de confirmação após “envio” bem-sucedido -->
  <div class="modal-backdrop" id="successModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <p id="modalTitle">Mensagem enviada com sucesso!</p>
      <button type="button" class="modal-close" id="modalClose">Fechar</button>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2026 Cryswerton Silva — Currículo online · Aplicação Web e Móveis</p>
  </footer>

  <script src="js/main.js" defer></script>
  <script src="js/contato.js" defer></script>
</body>
</html>
